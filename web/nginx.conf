# Web de Fototeca Viva: sirve los archivos estáticos y hace de proxy de /api/ hacia el servicio (R8).
# La web nunca habla con el servidor de modelos ni con la base vectorial: solo con /api/*.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Varias fotos de hasta 10 MB por petición (la API valida el límite por archivo y responde 413).
    client_max_body_size 60m;

    location /api/ {
        # Resolución en tiempo de petición: nginx arranca aunque el servicio aún no esté listo.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $servicio http://servicio:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $servicio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Una ficha en CPU puede tardar más de 60 s (valor por defecto de nginx).
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /nginx.conf { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
