[project]
name = "fototeca"
version = "0.1.0"
description = "Fototeca Viva: catalogación accesible y trazable de archivos fotográficos"
requires-python = "==3.12.*"
# Versiones fijadas con == (versiones exactas para una demo reproducible y sin red). Se resuelven en uv.lock y se exportan a requirements.txt.
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "piexif==1.1.3",
  "pyyaml==6.0.3",
  "python-multipart==0.0.32",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "rdflib==7.6.0",
  "pypdf==6.21.2",
  "matplotlib==3.11.2",
  "sacrebleu==2.6.0",
]

[dependency-groups]
# Se instalan también en la imagen: las pruebas corren dentro del contenedor `servicio`.
dev = [
  "pytest==9.1.1",
  "import-linter==2.15",
]

[tool.uv]
# Solo versiones publicadas hasta el 2026-10-24, 14 días antes de fijarlas (2026-11-07), también las transitivas:
# así se evitan regresiones de versiones recién publicadas en una demo sin red.
exclude-newer = "2026-10-24T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
addopts = "-m 'not lento'"
markers = [
  "lento: pruebas de humo con modelos reales; requieren Ollama con los modelos descargados (pytest -m lento)",
]
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ── Contrato de capas (R6), verificado por pruebas/test_contratos.py ──
[tool.importlinter]
root_packages = ["fototeca"]

[[tool.importlinter.contracts]]
name = "Capas del servicio (C1→C7)"
type = "layers"
layers = [
  "fototeca.api",
  "fototeca.orquestacion",
  "fototeca.guardrails",
  "fototeca.cache",
  "fototeca.contexto",
  "fototeca.modelos",
  "fototeca.datos",
  "fototeca.dominio",
]

[[tool.importlinter.contracts]]
name = "Transversales independientes"
type = "forbidden"
source_modules = ["fototeca.observabilidad", "fototeca.retroalimentacion"]
forbidden_modules = [
  "fototeca.api", "fototeca.orquestacion", "fototeca.guardrails",
  "fototeca.cache", "fototeca.contexto", "fototeca.modelos", "fototeca.datos",
]

[[tool.importlinter.contracts]]
name = "Dominio sin dependencias internas"
type = "forbidden"
source_modules = ["fototeca.dominio"]
forbidden_modules = ["fototeca.observabilidad", "fototeca.retroalimentacion"]
